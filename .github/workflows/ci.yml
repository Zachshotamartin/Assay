name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CI: "true"
  TZ: UTC

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Type-check all projects
        run: npm run typecheck

  lint-docs:
    name: lint-docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Check documentation claims and status
        run: npm run lint:docs

  unit-property:
    name: unit-property
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Run unit and property tests
        run: npm run test:unit

  arch-boundaries:
    name: arch-boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Enforce workspace boundaries
        run: npm run lint:architecture

  clean-clone-linux:
    name: clean-clone-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Run one-command bootstrap verification
        run: npm run verify

  clean-clone-macos:
    name: clean-clone-macos
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Run one-command bootstrap verification
        run: npm run verify

  store-core:
    name: store-core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Run store durability and corruption tests
        run: npm run test:store

  e2e-simulated:
    name: e2e-simulated
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GOLDEN_POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      GOLDEN_POLICY_PR_BODY: ${{ github.event.pull_request.body || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Build packaged CLI
        run: npm run build
      - name: Run simulated end-to-end tests
        run: npm run test:e2e:simulated
      - name: Enforce semantic golden review
        run: npm run check:goldens
